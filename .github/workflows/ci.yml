name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  # Placeholders so the Zod/Pydantic env contracts pass at import time in CI.
  DATABASE_URL: postgresql://postgres:postgres@localhost:5432/aidsamentor
  DIRECT_DATABASE_URL: postgresql://postgres:postgres@localhost:5432/aidsamentor
  JWT_ACCESS_SECRET: ci-access-secret-that-is-at-least-32-characters
  JWT_REFRESH_SECRET: ci-refresh-secret-that-is-at-least-32-characters
  AI_SERVICE_HMAC_SECRET: ci-shared-hmac-secret-32-characters-min

jobs:
  node:
    name: Node — lint, types, tests
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: aidsamentor
        ports: ['5432:5432']
        options: >-
          --health-cmd pg_isready --health-interval 10s
          --health-timeout 5s --health-retries 5
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 9
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @repo/db generate
      - run: pnpm typecheck
      - run: pnpm --filter @repo/db exec prisma validate
      - run: pnpm test

  python:
    name: Python — analysis, triggers, guard
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/ai
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - run: pip install -e ".[dev]"
      - run: ruff check app tests
      - name: Stage-1 signal engine
        run: pytest tests/test_analysis.py -q
      - name: Trigger policy
        run: pytest tests/test_triggers.py -q

  guard:
    # A prompt change cannot merge if it makes the mentor more willing to hand
    # over answers. This gate is what turns that from a promise into a fact.
    name: Response Guard red-team (required)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/ai
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - run: pip install -e ".[dev]"
      - run: pytest tests/test_guard -q --tb=short

  build:
    name: Build
    runs-on: ubuntu-latest
    needs: [node]
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 9
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @repo/db generate
      - run: pnpm build
        env:
          NEXT_PUBLIC_API_URL: https://api.example.com
          NEXT_PUBLIC_SOCKET_URL: https://api.example.com
